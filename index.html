<title>Maintenance Management System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--cd:#161616;--tx:#f4f4f4;--mu:#9b9b9b;--ln:#2c2c2c;--ac:#f4f4f4;--acx:#0a0a0a;--lg:screen;--lf:invert(1);--ok:#5fd39b;--wa:#f0a45c;--er:#f27d72;--okb:#12301f;--wab:#33230f;--erb:#361a18}}
:root[data-theme="dark"]{--bg:#0a0a0a;--cd:#161616;--tx:#f4f4f4;--mu:#9b9b9b;--ln:#2c2c2c;--ac:#f4f4f4;--acx:#0a0a0a;--lg:screen;--lf:invert(1);--ok:#5fd39b;--wa:#f0a45c;--er:#f27d72;--okb:#12301f;--wab:#33230f;--erb:#361a18}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
[hidden]{display:none!important}
h1,h2,header b,.role b,th,.stat b,nav button,button.p{font-family:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:#0a0a0a;color:#fff;border-bottom:3px solid #fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
header b{font-size:15px;font-weight:800;flex:1}.who{color:#bdbdbd;font-size:13px}
header button.g{color:#fff;border-color:#777;background:transparent;font-weight:700}header button.g:hover{background:#fff;color:#0a0a0a}
main{max-width:860px;margin:0 auto;padding:20px 18px}
h1{font-size:clamp(24px,5.4vw,40px);line-height:1.05;font-weight:800;margin:8px 0 6px}
h2{font-size:16px;font-weight:800;margin:0 0 14px;padding-left:10px;border-left:5px solid var(--ac)}.mu{color:var(--mu)}
.hero{text-align:center;padding:14px 0 6px}
.logo{display:block;margin:10px auto 6px;width:min(340px,80%);height:auto;mix-blend-mode:var(--lg);filter:var(--lf)}
.card{background:var(--cd);border:1.5px solid var(--ln);border-radius:2px;padding:18px;margin-bottom:14px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.role{all:unset;cursor:pointer;background:var(--cd);border:1.5px solid var(--ln);border-left:7px solid var(--ac);border-radius:2px;padding:18px;box-sizing:border-box;transition:transform .12s}
.role:hover{transform:translateX(4px);border-color:var(--ac)}.role b{display:block;font-size:16px;font-weight:800}.role span{color:var(--mu);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;border-bottom:1.5px solid var(--ln)}
nav button{all:unset;cursor:pointer;padding:9px 14px;white-space:nowrap;font-size:12px;font-weight:800;color:var(--mu);border-bottom:4px solid transparent;margin-bottom:-1.5px}
nav button.on{color:var(--tx);border-bottom-color:var(--ac)}
label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin-bottom:12px}
input,select,button{font:inherit}
input,select{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border:1.5px solid var(--ln);border-radius:2px;background:var(--bg);color:var(--tx);text-transform:none;letter-spacing:0;font-weight:400}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
input[readonly]{opacity:.65}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.row,.row3{grid-template-columns:1fr}}
button.p{background:var(--ac);color:var(--acx);border:0;padding:12px 26px 12px 22px;cursor:pointer;font-weight:800;font-size:13px;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
button.p:hover{opacity:.85}
button.g{background:none;border:1.5px solid var(--ln);color:var(--tx);border-radius:2px;padding:7px 12px;cursor:pointer;font-weight:600}
.note{padding:11px 14px;border-radius:2px;margin-bottom:14px;font-size:14px;border-left:5px solid currentColor}
.ok{background:var(--okb);color:var(--ok)}.wa{background:var(--wab);color:var(--wa)}.er{background:var(--erb);color:var(--er)}
.duty{background:var(--bg);padding:9px 12px;margin:0 0 12px;border-left:5px solid var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--cd);border:1.5px solid var(--ln);border-top:5px solid var(--ac);border-radius:2px;padding:14px}.stat b{font-size:34px;font-weight:800;display:block;line-height:1.1}.stat span{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:800;font-size:11px;border-bottom:2px solid var(--ac)}
.tag{padding:2px 9px;border-radius:2px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
pre{background:var(--bg);padding:12px;border-radius:2px;overflow-x:auto;margin:0}
.ir{display:grid;grid-template-columns:1fr 110px;gap:10px}

function setName(n,t){n=n.trim();if(!n)return flash('Please enter a name.','er');ses.name=n;ses.tab=t;nt=null;render()}
const loginV=()=>`<section class=card><h2>Admin login</h2><div class=row><label>ID<input id=lid inputmode=numeric></label><label>Password<input id=lpw type=password></label></div>
 <p class=mu style="font-size:13px">admins.csv has no password column, so any non-empty password is accepted until one is added (as a third column).</p><button class=p onclick="login()">Login</button></section>`;
function login(){const id=$('#lid').value.trim(),pw=$('#lpw').value,a=db.admins.find(x=>x[1]===id);
 if(!a||!pw||(a[2]&&a[2]!==pw))return flash('Invalid Login!','er');ses.name=a[0];ses.tab='dash';flash(`Login successful. Welcome ${a[0]}!`,'ok')}

const V={
raise:()=>{const d=today();return `<section class=card><h2>Raise a complaint</h2>
 <div class=row><label>Date<input type=date id=d value="${d}" oninput="sync()"></label><label>Day<input id=dy readonly value="${dayOf(d)}"></label></div>
 <p class=duty>Duty member(s): <b id=du>${esc(dutyOf(d)||'Not Found')}</b></p>
 <label>Repair type<select id=t onchange="sync()"><option>Plumbing<option>Electric<option>Carpentry</select></label>
 <div id=pl class=row3><label>Side<select id=side><option>A14 Side<option>A05 Side<option>B12 Side<option>B1 Side</select></label>
 <label>Problem<select id=pr><option>Tap<option>Bathroom<option>Washroom</select></label><label>Number<input id=num></label></div>
 <label id=rm hidden>Room<input id=room></label><button class=p onclick="raise()">Submit complaint</button></section>`},
upd:()=>{const n=ses.name.toLowerCase(),f=(l,s)=>l.filter(c=>c.name.trim().toLowerCase()===n).map(c=>[c.id,c.type,esc(c.room),esc(c.day),`<span class="tag ${s?'ok':'wa'}">${s?'Completed':'Pending'}</span>`]);
 return `<section class=card><h2>My repair updates</h2>${tbl(['ID','Type','Room','Day','Status'],[...f(db.complaints,0),...f(db.records,1)])}</section>`},
req:()=>{const d=today();return `<section class=card><h2>Request an item</h2>
 <div class=row><label>Date<input type=date id=d value="${d}" oninput="$('#dy').value=dayOf(this.value)"></label><label>Day<input id=dy readonly value="${dayOf(d)}"></label></div>
 <label>Item<input id=item list=il oninput="chk()" autocomplete=off></label><datalist id=il>${Object.keys(db.stock).map(k=>`<option value="${esc(k)}">`).join('')}</datalist>
 <p id=av class=mu></p><button class=p onclick="reqItem()">Save request</button></section>`},
prev:()=>`<section class=card><h2>Previous item requests</h2>${tbl(['SRD','Date','Day','Item'],db.srd.map(r=>E(r.name,r.date,r.day,r.item)))}</section>`,
dash:()=>{const s=Object.values(db.stock);return `<div class=stats><div class=stat><b>${db.complaints.length}</b><span>Pending repairs</span></div><div class=stat><b>${db.records.length}</b><span>Completed repairs</span></div><div class=stat><b>${s.length}</b><span>Stock items</span></div><div class=stat><b>${s.filter(q=>q<=0).length}</b><span>Out of stock</span></div></div>
 <section class=card><h2>Admin: ${esc(ses.name)}</h2><p class=mu>Use the tabs above to view complaints, complete repairs and update stock.</p></section>`},
comp:()=>`<section class=card><h2>All complaints</h2>${tbl(['Name','Type','ID','Day','Assigned','Room'],db.complaints.map(c=>E(c.name,c.type,c.id,c.day,c.member,c.room)))}</section>`,
pend:()=>`<section class=card><h2>Pending complaints</h2>${db.complaints.length?`<pre>${esc(db.complaints.map(c=>[c.name,c.type,c.id,c.cost,c.day,c.member,c.room].join(',')).join('\n'))}</pre>`:'<p class=mu>No pending complaints.</p>'}</section>`,
done:()=>`<section class=card><h2>Complete a repair</h2><label>Repair ID<input id=rid inputmode=numeric></label>
 <p class=mu style="margin:0 0 6px">Items actually used (deducted from stock):</p><datalist id=il>${Object.keys(db.stock).map(k=>`<option value="${esc(k)}">`).join('')}</datalist>
 <div id=items><div class=ir><input list=il placeholder="Item"><input type=number min=0 placeholder="Qty"></div></div>
 <p><button class=g onclick="addRow()">+ Add another item</button></p><button class=p onclick="complete()">Mark complete</button></section>`,
stock:()=>`<section class=card><h2>Update stock</h2><div class=row><label>Item<input id=sn2 list=il></label><label>Quantity to add<input id=sq type=number min=0></label></div>
 <datalist id=il>${Object.keys(db.stock).map(k=>`<option value="${esc(k)}">`).join('')}</datalist><button class=p onclick="addStock()">Add stock</button></section>
 <section class=card><h2>Current stock</h2><label>Search<input oninput="fs(this.value)"></label><div class=tw><table id=st><tr><th>Item</th><th>Quantity</th></tr>${Object.entries(db.stock).map(([k,q])=>`<tr><td>${esc(k)}</td><td>${q}</td></tr>`).join('')}</table></div></section>`
};

function sync(){const d=$('#d').value,p=$('#t').value==='Plumbing';$('#dy').value=dayOf(d);$('#du').textContent=dutyOf(d)||'Not Found';$('#pl').hidden=!p;$('#rm').hidden=p}
function raise(){const d=$('#d').value,t=$('#t').value;if(!d)return flash('Pick a date.','er');let room;
 if(t==='Plumbing'){const n=$('#num').value.trim();if(!n)return flash('Enter the tap / bathroom / washroom number.','er');room=`${$('#side').value} ${$('#pr').value} ${n}`}
 else{room=$('#room').value.trim();if(!room)return flash('Enter the room.','er')}
 const id=nextId(),m=dutyOf(d)||'Not Found';db.complaints.push({name:ses.name,type:t,id,cost:0,day:dayOf(d),member:m,room});save();
 flash(`Complaint saved. Repair ID ${id} · assigned to ${m}.`,'ok','upd')}
function chk(){const k=findItem($('#item').value),el=$('#av');
 if(!$('#item').value.trim())el.textContent='';else if(k){el.className='mu';el.textContent=`Available in stock · Quantity in stock: ${db.stock[k]}`}else{el.className='';el.style.color='var(--er)';el.textContent='Item is not available in stock. Please contact any Maintenance member.'}}
function reqItem(){const k=findItem($('#item').value);if(!k)return flash('Item is not available in stock. Please contact any Maintenance member.','er');
 const d=$('#d').value;db.srd.push({name:ses.name,date:d,day:dayOf(d),item:k});save();flash('Item request saved successfully!','ok','prev')}
function addRow(){$('#items').insertAdjacentHTML('beforeend','<div class=ir style="margin-top:8px"><input list=il placeholder="Item"><input type=number min=0 placeholder="Qty"></div>')}
function complete(){const id=+$('#rid').value,c=db.complaints.find(x=>x.id===id);if(!c)return flash('Repair ID not found!','er');const w=[];
 document.querySelectorAll('.ir').forEach(r=>{const n=r.children[0].value.trim(),q=+r.children[1].value;if(!n||!(q>0))return;const k=findItem(n);
  if(!k){w.push(`${n} is not in the stock list`);return}if(db.stock[k]<q)w.push(`${k}: only ${db.stock[k]} in stock`);db.stock[k]=Math.max(0,db.stock[k]-q)});
