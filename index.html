<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maintenance Management System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#efefef;--cd:#fff;--tx:#0a0a0a;--mu:#5f5f5f;--ln:#d6d6d6;--ac:#0a0a0a;--acx:#fff;--lg:multiply;--lf:none;--ok:#0f7a4a;--wa:#a8570a;--er:#c0362c;--okb:#e2f5ea;--wab:#fdf0e1;--erb:#fdeceb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--cd:#161616;--tx:#f4f4f4;--mu:#9b9b9b;--ln:#2c2c2c;--ac:#f4f4f4;--acx:#0a0a0a;--lg:screen;--lf:invert(1);--ok:#5fd39b;--wa:#f0a45c;--er:#f27d72;--okb:#12301f;--wab:#33230f;--erb:#361a18}}
:root[data-theme="dark"]{--bg:#0a0a0a;--cd:#161616;--tx:#f4f4f4;--mu:#9b9b9b;--ln:#2c2c2c;--ac:#f4f4f4;--acx:#0a0a0a;--lg:screen;--lf:invert(1);--ok:#5fd39b;--wa:#f0a45c;--er:#f27d72;--okb:#12301f;--wab:#33230f;--erb:#361a18}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
[hidden]{display:none!important}
h1,h2,header b,.role b,th,.stat b,nav button,button.p{font-family:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:#0a0a0a;color:#fff;border-bottom:3px solid #fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
header b{font-size:15px;font-weight:800;flex:1}.who{color:#bdbdbd;font-size:13px}
header button.g{color:#fff;border-color:#777;background:transparent;font-weight:700}header button.g:hover{background:#fff;color:#0a0a0a}
main{max-width:860px;margin:0 auto;padding:20px 18px}
h1{font-size:clamp(24px,5.4vw,40px);line-height:1.05;font-weight:800;margin:8px 0 6px}
h2{font-size:16px;font-weight:800;margin:0 0 14px;padding-left:10px;border-left:5px solid var(--ac)}.mu{color:var(--mu)}
.hero{text-align:center;padding:14px 0 6px}
.logo{display:block;margin:10px auto 6px;width:min(340px,80%);height:auto;mix-blend-mode:var(--lg);filter:var(--lf)}
.card{background:var(--cd);border:1.5px solid var(--ln);border-radius:2px;padding:18px;margin-bottom:14px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.role{all:unset;cursor:pointer;background:var(--cd);border:1.5px solid var(--ln);border-left:7px solid var(--ac);border-radius:2px;padding:18px;box-sizing:border-box;transition:transform .12s}
.role:hover{transform:translateX(4px);border-color:var(--ac)}.role b{display:block;font-size:16px;font-weight:800}.role span{color:var(--mu);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;border-bottom:1.5px solid var(--ln)}
nav button{all:unset;cursor:pointer;padding:9px 14px;white-space:nowrap;font-size:12px;font-weight:800;color:var(--mu);border-bottom:4px solid transparent;margin-bottom:-1.5px}
nav button.on{color:var(--tx);border-bottom-color:var(--ac)}
label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin-bottom:12px}
input,select,button{font:inherit}
input,select{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border:1.5px solid var(--ln);border-radius:2px;background:var(--bg);color:var(--tx);text-transform:none;letter-spacing:0;font-weight:400}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
input[readonly]{opacity:.65}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.row,.row3{grid-template-columns:1fr}}
button.p{background:var(--ac);color:var(--acx);border:0;padding:12px 26px 12px 22px;cursor:pointer;font-weight:800;font-size:13px;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
button.p:hover{opacity:.85}
button.g{background:none;border:1.5px solid var(--ln);color:var(--tx);border-radius:2px;padding:7px 12px;cursor:pointer;font-weight:600}
.note{padding:11px 14px;border-radius:2px;margin-bottom:14px;font-size:14px;border-left:5px solid currentColor}
.ok{background:var(--okb);color:var(--ok)}.wa{background:var(--wab);color:var(--wa)}.er{background:var(--erb);color:var(--er)}
.duty{background:var(--bg);padding:9px 12px;margin:0 0 12px;border-left:5px solid var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--cd);border:1.5px solid var(--ln);border-top:5px solid var(--ac);border-radius:2px;padding:14px}.stat b{font-size:34px;font-weight:800;display:block;line-height:1.1}.stat span{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:800;font-size:11px;border-bottom:2px solid var(--ac)}
.tag{padding:2px 9px;border-radius:2px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
pre{background:var(--bg);padding:12px;border-radius:2px;overflow-x:auto;margin:0}
.ir{display:grid;grid-template-columns:1fr 110px;gap:10px}
</style></head><body>
<div id="app"><main><section class="card"><h2>Loading Maintenance Management System…</h2><p class="mu">Connecting to the application.</p></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js'"></script>
<script>window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&!a.dataset.rendered){a.innerHTML="<main><section class=card><h2>Application error</h2><p class=mu>"+String(e.message||"The application could not start.").replace(/[<>&]/g,function(x){return({"<":"&lt;",">":"&gt;","&":"&amp;"})[x]})+"</p><p class=mu>Please refresh once.</p></section></main>"}});</script><script src="app.js?v=20260930-16"></script></body></html>
