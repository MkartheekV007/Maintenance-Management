{% extends "base.html" %}
{% block title %}Log in · Maintenance{% endblock %}
{% block body %}
<section class="panel narrow">
  <h1>Log in</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <fieldset class="seg">
      <legend>I am a</legend>
      <label><input type="radio" name="role" value="student" checked> Student</label>
      <label><input type="radio" name="role" value="srd"> SRD</label>
      <label><input type="radio" name="role" value="admin"> Admin</label>
    </fieldset>
    <label>Registration number
      <input id="ident" name="ident" required autocomplete="username" inputmode="numeric">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="primary">Log in</button>
  </form>
</section>
<script>
  const labels = {student: ["Registration number", "numeric"], srd: ["Your name", "text"], admin: ["Admin ID", "numeric"]};
  document.querySelectorAll('input[name=role]').forEach(r => r.addEventListener('change', () => {
    const [text, mode] = labels[r.value];
    const box = document.getElementById('ident');
    box.parentNode.firstChild.textContent = text + " ";
    box.inputMode = mode;
  }));
</script>
{% endblock %}
