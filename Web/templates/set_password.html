{% extends "base.html" %}
{% block title %}Choose your password · Maintenance{% endblock %}
{% block body %}
<section class="panel narrow">
  <h1>Choose your own password</h1>
  <p class="hint">You logged in with the starting password. Pick a password only you know before you continue.</p>
  <form method="post" action="{{ url_for('admin_password') }}" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>New password (8+ characters) <input type="password" name="new" required minlength="8" autocomplete="new-password" autofocus></label>
    <label>New password again <input type="password" name="again" required minlength="8" autocomplete="new-password"></label>
    <button class="primary">Save password</button>
  </form>
</section>
{% endblock %}
